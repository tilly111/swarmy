## Simulation parameters
FPS: 60                 # Frames per second. A typical value is 60 frames per second
max_timestep: 2000      # Maximum number of timesteps for the simulation
seed: null              # set to a number (e.g. 42) to make runs repeatable, null = different every run

## World parameters
world_width: 500
world_height: 500
background_color: !!python/tuple [255, 255, 255]

## Robot parameters
number_of_agents: 500
default_velocity: 2.5
default_angular_velocity: 2
save_trajectory: 1

## Controller ratios: share of the swarm for each controller in the controllers list in workspace.py (same order)
# Example: If there are 6 robots and the first three robots use controllers[0] and the last three robots use controllers[1]:
# controller_ratios: [0.5, 0.5]
controller_ratios: [1.0]

## Rendering
# rendering: 1   normal window
# rendering: 0   borderless window
# rendering: -1  no window (no fps limit)
rendering: 1
